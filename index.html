<!DOCTYPE html>
<html>
<head>
  <title>Last Word Chat</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #1a1a1a; color: white; }
    h1 { text-align: center; color: #ff6b00; }
    #chat { height: 400px; overflow-y: auto; border: 2px solid #ff6b00; padding: 10px; background: #2a2a2a; border-radius: 8px; margin-bottom: 10px; }
    #chat p { margin: 5px 0; padding: 8px; background: #333; border-radius: 5px; }
    #input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border: none; border-radius: 5px; background: #333; color: white; }
    button { padding: 12px 20px; background: #ff6b00; color: white; border: none; border-radius: 5px; cursor: pointer; }
    button:hover { background: #ff8533; }
  </style>
</head>
<body>
  <h1>Last Word Chat 🔥</h1>
  <div id="chat"></div>
  <div id="input-area">
    <input id="msg" placeholder="Message likho..." onkeypress="if(event.key==='Enter') sendMsg()" />
    <button onclick="sendMsg()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chat = document.getElementById('chat');
    const msg = document.getElementById('msg');

    socket.on('chat message', (data) => {
      chat.innerHTML += `<p><b>${data.user}:</b> ${data.text}</p>`;
      chat.scrollTop = chat.scrollHeight;
    });

    function sendMsg() {
      if(msg.value.trim()) {
        socket.emit('chat message', {user: 'User', text: msg.value});
        msg.value = '';
      }
    }
  </script>
</body>
</html>
